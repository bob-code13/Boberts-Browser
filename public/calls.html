<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bobert Calls</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#202124;background:#f8faff}header{display:flex;align-items:center;justify-content:space-between;background:white;padding:18px 24px;border-bottom:1px solid #ddd}header img{width:34px;vertical-align:middle;margin-right:10px}a{color:#1967d2;text-decoration:none}main{max-width:900px;margin:30px auto;padding:20px}section{background:white;border:1px solid #e0e5ee;border-radius:20px;padding:24px;margin-bottom:18px}button,select{font:inherit;padding:11px 16px;border:1px solid #d2e0fa;border-radius:12px;background:#edf3ff;color:#174d9c;cursor:pointer}button:disabled{opacity:.5;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.end{background:#d93025;color:white;border:0}.videos{display:grid;grid-template-columns:2fr 1fr;gap:12px}video{width:100%;background:#182334;border-radius:14px;min-height:100px;max-height:420px}#status{color:#526078} [hidden]{display:none!important}</style></head><body><header><strong><img src="/boberts-logo.png" alt="">Bobert Calls</strong><a href="/apps.html">← Apps</a></header><main><section><h1>Voice and video calls</h1><p id="status" role="status">Choose a contact to call.</p><select id="people" aria-label="Contact"></select><div class="controls"><button id="voice">Voice call</button><button id="video">Video call</button><button id="accept" hidden>Accept</button><button id="end" class="end" hidden>End / Decline</button></div></section><section id="media" hidden><div class="videos"><video id="remote" autoplay playsinline></video><video id="local" autoplay muted playsinline></video></div><div class="controls"><button id="mute">Mute</button><button id="camera">Camera off</button><button id="share">Share screen</button></div></section></main><script src="/calls.js" defer></script></body></html>
