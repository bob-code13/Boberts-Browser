<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bobert Calls</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#202124;background:#f8faff}header{display:flex;align-items:center;justify-content:space-between;background:white;padding:18px 24px;border-bottom:1px solid #ddd}header img{width:34px;vertical-align:middle;margin-right:10px}a{color:#1967d2;text-decoration:none}main{max-width:900px;margin:30px auto;padding:20px}section{background:white;border:1px solid #e0e5ee;border-radius:20px;padding:24px;margin-bottom:18px}button,select{font:inherit;padding:11px 16px;border:1px solid #d2e0fa;border-radius:12px;background:#edf3ff;color:#174d9c;cursor:pointer}button:disabled{opacity:.5;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.end{background:#d93025;color:white;border:0}.videos{display:grid;grid-template-columns:2fr 1fr;gap:12px}video{width:100%;background:#182334;border-radius:14px;min-height:100px;max-height:420px}#status{color:#526078} [hidden]{display:none!important}body{height:100dvh;display:flex;flex-direction:column}main{width:min(100%,1000px);margin:auto;padding:12px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}section{margin:0;text-align:center;padding:16px}h1{margin:0;font-size:24px}.controls{justify-content:center}button{border-radius:24px}#accept{background:#16864b;color:white;border:0}#media{flex:1;min-height:0;max-height:65vh;background:#172337;color:white;display:flex;flex-direction:column}.videos{position:relative;flex:1;min-height:0;display:block}.tile{position:relative;width:100%;height:100%;display:grid;place-items:center;background:#263850;border-radius:14px;overflow:hidden}.tile video{position:absolute;inset:0;width:100%;height:100%;max-height:none;min-height:0;object-fit:contain}.local{position:absolute;bottom:10px;right:10px;width:25%;height:30%;border:2px solid #fff6}.avatar{width:80px;height:80px;border-radius:50%;background:#45658d;display:grid;place-items:center;font-size:28px;font-weight:700}.local .avatar{width:42px;height:42px;font-size:14px}.voice .local{display:none}.voice .tile{background:transparent}.voice video{opacity:0;pointer-events:none}.voice .avatar{width:110px;height:110px;font-size:38px}#peer-name{font-size:22px;font-weight:700;margin:0}#media button{background:#354964;color:white;border:0}#media .end{background:#d93025}body.active h1{display:none}@media(max-height:650px){section{padding:8px}header{padding:8px 16px}#media{max-height:60vh}}</style></head><body><header><strong><img src="/boberts-logo.png" alt="">Bobert Calls</strong><a href="/apps.html">← Apps</a></header><main><section><h1>Voice and video calls</h1><p id="peer-name" hidden></p><p id="status" role="status">Choose a contact to call.</p><select id="people" aria-label="Contact"></select><div class="controls"><button id="voice">Voice call</button><button id="video">Video call</button><button id="accept" hidden>Accept</button><button id="end" class="end" hidden>End / Decline</button></div></section><section id="media" hidden><div class="videos" id="videos"><div class="tile"><div class="avatar" id="remote-avatar">?</div><video id="remote" autoplay playsinline hidden></video></div><div class="tile local"><div class="avatar">You</div><video id="local" autoplay muted playsinline hidden></video></div></div><div class="controls"><button id="mute">Mute</button><button id="camera">Camera off</button><button id="share">Share screen</button><button id="hangup" class="end">End call</button></div></section></main><script src="/calls.js?v=2" defer></script></body></html>
