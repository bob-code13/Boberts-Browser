<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BobertGPT</title><link rel="icon" href="/boberts-logo.png"><style>
*{box-sizing:border-box}body{font:15px system-ui,Arial;margin:0;background:#f7f9fd;color:#1d2939}.app{max-width:900px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #dce2ec;background:white}header img{width:40px}h1{font-size:22px;margin:0}a{margin-left:auto;color:#1967d2;text-decoration:none}.chat{flex:1;padding:20px;overflow:auto;min-height:200px}.bubble{max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0;padding:14px 17px;border-radius:17px;background:white;border:1px solid #e1e6ee}.mine{margin-left:auto;background:#e7f0ff}.note{color:#667085;font-size:13px}.composer{position:sticky;bottom:0;background:white;padding:16px;border-top:1px solid #e1e6ee}textarea{width:100%;min-height:70px;padding:12px;border:1px solid #bfc9d8;border-radius:12px;font:inherit;resize:vertical}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:9px}button{background:#1967d2;color:white;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}.files{font-size:13px;color:#475467}input[type=file]{max-width:250px}#new{background:#e8effb;color:#1967d2}
</style></head><body><div class="app"><header><img src="/boberts-logo.png" alt=""><h1>BobertGPT</h1><a href="/">Back to Browser</a></header><main id="chat" class="chat" aria-live="polite"><p class="note">Ask a question or attach images, PDFs, or text files. Free AI usage limits apply. Files and messages are sent to Google Gemini for processing. Don't upload sensitive information.</p></main><form id="form" class="composer"><textarea id="prompt" placeholder="Ask BobertGPT..." maxlength="12000" required></textarea><div class="actions"><label>Attach files <input id="files" type="file" multiple accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,.txt"></label><span class="files" id="chosen"></span><button type="submit" id="send">Send</button><button type="button" id="new">New chat</button></div><p class="note" id="status">Powered by Gemini. No paid API fallback.</p></form></div><script src="/bobertgpt.js"></script></body></html>
