<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bobert Groups</title><link rel="icon" type="image/png" href="/boberts-logo.png?v=2"><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f5f7fb;color:#203047}header,main{padding:20px;max-width:1000px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}button,a{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#e1ebff;color:#174d9c;text-decoration:none;font:inherit;cursor:pointer}section{background:white;border-radius:18px;padding:20px;margin-bottom:16px}input{padding:12px;border:1px solid #ccd5e4;border-radius:12px;font:inherit}#thread{height:35vh;overflow:auto}#thread p{background:#edf2fa;padding:12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{background:#263850;color:white;border-radius:16px;position:relative;min-height:150px;display:grid;place-items:center;overflow:hidden}.tile video{width:100%;max-height:250px}.tile span{padding:10px}.danger{background:#c62828;color:white}[hidden]{display:none!important}label{display:block;margin:8px}#status{color:#53657d}body.call-only{background:#172337;color:white}body.call-only header,body.call-only #home,body.call-only #chat #thread,body.call-only #chat #form,body.call-only #chat #leave,body.call-only #chat #back,body.call-only #memberlist{display:none!important}body.call-only section{background:#172337;color:white}body.call-only #stage{min-height:65vh}body.call-only #tiles{margin:24px 0}body.call-only .tile{min-height:220px}body.call-only button{border-radius:24px}body.call-only #status{color:#dbe7fa}body.call-only{height:100dvh;overflow:hidden}body.call-only main{height:100%;max-width:1200px;padding:12px 18px;display:flex;flex-direction:column;gap:8px}body.call-only #stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;margin:0;text-align:center}#calltitle{margin:8px 0}#timer{margin:4px;color:#b9cbe0}body.call-only #tiles{flex:1;min-height:0;margin:8px 0;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}body.call-only #tiles:has(.tile:only-child){grid-template-columns:1fr}body.call-only .tile{min-height:0;background:#263850;isolation:isolate}body.call-only .tile video{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;background:#101a29}body.call-only .tile .label{position:absolute;bottom:8px;left:8px;background:#101a29bb;border-radius:8px;z-index:2;font-size:12px}body.call-only .initials{width:64px;height:64px;border-radius:50%;background:#456080;display:grid;place-items:center;font-size:24px;font-weight:bold}#group-dock{display:flex;justify-content:center;gap:16px;padding:12px 0;flex:none}#group-dock button,#chat .accept,#chat .decline{width:54px;height:54px;border:0;border-radius:50%;background:#354964;color:white;padding:14px;display:inline-grid;place-items:center}#group-dock .danger,#chat .decline{background:#dc3535}#chat .accept{background:#169b55}#group-dock .off{background:#f1f5f9;color:#172337}#group-dock svg,#chat svg{width:26px;height:26px}body.call-only #chat,body.call-only #group-ended{text-align:center;margin:auto}body.call-only #invite{display:none}#group-ended button{margin-top:16px}body.call-only #status{margin:0;text-align:center;flex:none}</style></head><body class="call-only"><main><p id="status" role="status">Connecting…</p><section id="chat" hidden><h2 id="title"></h2><button id="voice">Join voice call</button> <button id="video">Join video call</button><a href="/calls.html" target="_top">Back to Calls</a></section><section id="stage" hidden><h2 id="calltitle"></h2><p id="timer"></p><div id="tiles"></div><div id="group-dock"><button id="mute">Mute</button><button id="camera">Camera off</button><button id="share">Share screen</button><button id="hangup" class="danger">Leave call</button></div></section><section id="group-ended" hidden><h1>Call ended</h1><p id="group-duration"></p><button id="return-calls">Back to Calls</button></section></main><script src="/groups.js?v=5" defer></script></body></html>
