<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bobert Groups</title><link rel="icon" type="image/png" href="/boberts-logo.png?v=2"><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f5f7fb;color:#203047}header,main{padding:20px;max-width:1000px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}button,a{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#e1ebff;color:#174d9c;text-decoration:none;font:inherit;cursor:pointer}section{background:white;border-radius:18px;padding:20px;margin-bottom:16px}input{padding:12px;border:1px solid #ccd5e4;border-radius:12px;font:inherit}#thread{height:35vh;overflow:auto}#thread p{background:#edf2fa;padding:12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{background:#263850;color:white;border-radius:16px;position:relative;min-height:150px;display:grid;place-items:center;overflow:hidden}.tile video{width:100%;max-height:250px}.tile span{padding:10px}.danger{background:#c62828;color:white}[hidden]{display:none!important}label{display:block;margin:8px}#status{color:#53657d}</style></head><body><header><strong>Bobert Groups</strong><a href="/apps.html">Back to Apps</a></header><main><p id="status" role="status"></p><section id="home"><h1>Groups</h1><div id="groups"></div><h2>Create a group</h2><input id="name" placeholder="Group name" maxlength="80"><div id="members"></div><button id="create">Create group</button></section><section id="chat" hidden><button id="back">Back to groups</button><h2 id="title"></h2><p id="memberlist"></p><button id="voice">Voice call</button> <button id="video">Video call</button> <button id="leave">Leave group</button><p id="invite"></p><div id="thread"></div><form id="form"><input id="message" maxlength="2000" required placeholder="Write a message"><button>Send</button></form></section><section id="stage" hidden><h2 id="calltitle"></h2><p id="timer"></p><div id="tiles"></div><button id="mute">Mute</button> <button id="camera">Camera off</button> <button id="share">Share screen</button> <button id="hangup" class="danger">Leave call</button></section></main><script src="/groups.js" defer></script><script src="/notifications.js?v=3" defer></script></body></html>
