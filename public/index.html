<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b16" />
  <title>Bobert's Browser</title>
  <link rel="icon" type="image/png" href="/boberts-logo.png?v=1" />
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <link rel="stylesheet" href="/index.css" />
  <script src="/register-sw.js?v=2" defer></script>
  <script src="/search.js?v=2" defer></script>
  <script src="/index.js?v=3" defer></script>
  <script src="/profile.js?v=1" defer></script>
</head>
<body>
  <header id="browser-chrome" class="browser-chrome" hidden>
    <div id="tab-strip" class="tab-strip" role="tablist" aria-label="Browser tabs"></div>
    <button id="new-tab" class="chrome-button new-tab" type="button" title="New tab" aria-label="New tab">+</button>
    <div class="navigation-bar">
      <img class="toolbar-brand-logo" src="/boberts-logo.png?v=1" alt="Bobert\'s Browser logo" width="30" height="30" />
      <button id="back-button" class="chrome-button" type="button" title="Back" aria-label="Back" disabled>←</button>
      <button id="forward-button" class="chrome-button" type="button" title="Forward" aria-label="Forward" disabled>→</button>
      <button id="reload-button" class="chrome-button" type="button" title="Reload current tab" aria-label="Reload current tab">↻</button>
      <button id="home-button" class="chrome-button" type="button" title="New tab home" aria-label="New tab home">⌂</button>
      <form id="tab-address-form" class="tab-address-form">
        <input id="tab-address" type="text" aria-label="Search or enter URL in current tab" placeholder="Search DuckDuckGo or enter a URL" autocomplete="off" spellcheck="false" />
        <button type="submit" aria-label="Navigate">Go ↗</button>
      </form>
      <button id="bookmark-button" class="chrome-button" type="button" title="Bookmark this page" aria-label="Bookmark this page">☆</button>
      <button id="bookmarks-toggle" class="chrome-button bookmarks-toggle" type="button" title="Show bookmarks" aria-label="Show bookmarks">Bookmarks</button>
  <div class="profile-wrap"><button id="profile-button" class="profile-button" type="button" aria-label="Profile" aria-expanded="false">BB</button><div id="profile-menu" class="profile-menu" hidden><strong id="profile-name">Account</strong><small id="profile-email"></small><small id="profile-hours"></small><a id="admin-link" href="/admin" hidden>Admin Dashboard</a><form action="/logout" method="post"><button type="submit">Sign out</button></form></div></div>
      
    </div>
  </header>
  <aside id="bookmarks-panel" class="bookmarks-panel" hidden aria-label="Saved bookmarks"><div class="bookmarks-heading"><strong>Bookmarks</strong><button id="bookmarks-close" type="button" aria-label="Close bookmarks">×</button></div><div id="bookmarks-list"></div></aside>
  <div id="tab-frames" class="tab-frames" hidden></div>
  <main class="homepage">
    <div id="home-profile-anchor"></div>
    <section class="hero" aria-label="Bobert's Browser home">
      
      <h1 class="wordmark"><span class="color-logo" aria-label="Bobert's Browser"><span class="c-blue">B</span><span class="c-red">o</span><span class="c-yellow">b</span><span class="c-blue">e</span><span class="c-green">r</span><span class="c-red">t</span><span class="c-blue">'</span><span class="c-yellow">s</span><span class="logo-gap"> </span><span class="c-blue">B</span><span class="c-red">r</span><span class="c-yellow">o</span><span class="c-blue">w</span><span class="c-green">s</span><span class="c-red">e</span><span class="c-blue">r</span></span></h1>
      
      <form id="sj-form" class="search-box">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="sj-search-engine" value="https://duckduckgo.com/?q=%s" type="hidden" />
        <input id="sj-address" type="text" aria-label="Search or enter a URL" placeholder="Search DuckDuckGo or type a URL" autocomplete="off" spellcheck="false" />
        <button type="submit" aria-label="Go">↵</button>
      </form>
      <div class="error-container" aria-live="polite">
        <p id="sj-error"></p>
        <pre id="sj-error-code"></pre>
      </div>
      
    </section>
  </main>
  <template id="new-tab-template">
    <section class="tab-home" aria-label="New tab homepage">
      <div class="tab-home-inner">
        
        <h1 class="wordmark"><span class="color-logo" aria-label="Bobert's Browser"><span class="c-blue">B</span><span class="c-red">o</span><span class="c-yellow">b</span><span class="c-blue">e</span><span class="c-green">r</span><span class="c-red">t</span><span class="c-blue">'</span><span class="c-yellow">s</span><span class="logo-gap"> </span><span class="c-blue">B</span><span class="c-red">r</span><span class="c-yellow">o</span><span class="c-blue">w</span><span class="c-green">s</span><span class="c-red">e</span><span class="c-blue">r</span></span></h1>
        
        <form class="search-box tab-home-form">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input class="tab-home-input" type="text" aria-label="Search or enter URL" placeholder="Search DuckDuckGo or type a URL" autocomplete="off" spellcheck="false" />
          <button type="submit" aria-label="Search">↵</button>
        </form>
        
      </div>
      <footer class="tab-home-footer">
        <span>© 2026 Bobert's Enterprise. All rights reserved.</span>
        <a href="/credits.html" aria-label="Open source licenses">Open-source licenses</a>
      </footer>
    </section>
  </template>
  <footer class="site-footer">
    <span>© 2026 Bobert's Enterprise. All rights reserved.</span>
    <a href="/credits.html" aria-label="Open source licenses">Open-source licenses</a>
  </footer>
</body>
</html>
